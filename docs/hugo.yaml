baseURL: "http://localhost:1313/"
title: "Sparki Documentation"
enableRobotsTXT: true
defaultContentLanguage: en

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  workspace: hugo.work
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Case Studies
      pageRef: /case-studies
      weight: 2
    - name: Field Notes
      pageRef: /blog
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search

params:
  description: Sparki product definition, validation, and MVP handoff.
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: light
    displayToggle: true
  search:
    enable: true
    type: flexsearch
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 20
    article:
      displayPagination: true
  toc:
    displayTags: true
