baseURL: "http://localhost:1313/"
title: "Sparki Documentation"
enableRobotsTXT: true
enableGitInfo: true
defaultContentLanguage: en

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  workspace: hugo.work
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

menu:
  main:
    - name: Home
      pageRef: /
      weight: 1
    - name: Start Here
      pageRef: /docs/start-here
      weight: 2
    - name: Product
      pageRef: /docs/product
      weight: 3
    - name: Final Site
      pageRef: /docs/final-site
      weight: 4
    - name: Research & Validation
      pageRef: /docs/validation
      weight: 5
    - name: Case Studies
      pageRef: /case-studies
      weight: 6
    - name: Audiences & Use Cases
      pageRef: /docs/audiences
      weight: 7
    - name: Decisions
      pageRef: /docs/decisions
      weight: 8
    - name: Real MVP
      pageRef: /docs/mvp
      weight: 9
    - name: Backend & Data
      pageRef: /docs/backend
      weight: 10
    - name: Roadmap
      pageRef: /docs/roadmap
      weight: 11
    - name: Go-to-Market
      pageRef: /docs/go-to-market
      weight: 12
    - name: Field Notes
      pageRef: /blog
      weight: 13
    - name: Artifacts
      pageRef: /docs/artifacts
      weight: 14
    - name: Search
      weight: 15
      params:
        type: search

  sidebar:
    - identifier: handoff
      name: Handoff Areas
      params:
        type: separator
      weight: 1
    - identifier: glossary
      name: Glossary
      pageRef: /glossary
      weight: 2
    - identifier: field-notes
      name: Field Notes
      pageRef: /blog
      weight: 3

params:
  description: Sparki product definition, validation, and MVP handoff.
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide
  theme:
    default: light
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
    width: wide
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  displayUpdatedAuthor: false
  externalLinkDecoration: true
  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 20
    article:
      displayPagination: true
  toc:
    displayTags: true
  page:
    width: wide
    displayPagination: true
