baseURL: "http://localhost:1313/"
title: "Sparki Documentation"
enableRobotsTXT: true
enableGitInfo: true
defaultContentLanguage: en

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  workspace: hugo.work
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

menu:
  main:
    - identifier: home
      name: Home
      pageRef: /
      weight: 1
    - identifier: docs
      name: Docs
      weight: 2
    - identifier: start-here
      name: Start Here
      pageRef: /docs/start-here
      parent: docs
      weight: 1
    - identifier: product
      name: Product
      pageRef: /docs/product
      parent: docs
      weight: 2
    - identifier: final-site
      name: Final Site
      pageRef: /docs/final-site
      parent: docs
      weight: 3
    - identifier: validation
      name: Research & Validation
      pageRef: /docs/validation
      parent: docs
      weight: 4
    - identifier: explore
      name: Explore
      weight: 3
    - identifier: case-studies
      name: Case Studies
      pageRef: /case-studies
      parent: explore
      weight: 1
    - identifier: audiences
      name: Audiences & Use Cases
      pageRef: /docs/audiences
      parent: explore
      weight: 2
    - identifier: delivery
      name: Delivery
      weight: 4
    - identifier: decisions
      name: Decisions
      pageRef: /docs/decisions
      parent: delivery
      weight: 1
    - identifier: mvp
      name: Real MVP
      pageRef: /docs/mvp
      parent: delivery
      weight: 2
    - identifier: backend
      name: Backend & Data
      pageRef: /docs/backend
      parent: delivery
      weight: 3
    - identifier: roadmap
      name: Roadmap
      pageRef: /docs/roadmap
      parent: delivery
      weight: 4
    - identifier: go-to-market
      name: Go-to-Market
      pageRef: /docs/go-to-market
      parent: delivery
      weight: 5
    - identifier: field-notes
      name: Field Notes
      pageRef: /blog
      weight: 5
    - identifier: artifacts
      name: Artifacts
      pageRef: /docs/artifacts
      weight: 6
    - identifier: search
      name: Search
      weight: 7
      params:
        type: search

  sidebar:
    - identifier: handoff
      name: Handoff Areas
      params:
        type: separator
      weight: 1
    - identifier: glossary
      name: Glossary
      pageRef: /glossary
      weight: 2
    - identifier: field-notes
      name: Field Notes
      pageRef: /blog
      weight: 3

params:
  description: Sparki product definition, validation, and MVP handoff.
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide
  theme:
    default: light
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
    width: wide
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  displayUpdatedAuthor: false
  externalLinkDecoration: true
  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 20
    article:
      displayPagination: true
  toc:
    displayTags: true
  page:
    width: wide
    displayPagination: true
